{{ $featured := where hugo.Data.artifacts "featured" true }}
<div class="work-grid">
  {{ range sort $featured "feature_order" }}
  <article class="work-card">
    <p class="work-meta">
      <span class="work-type">{{ .type }}</span>
      <time datetime="{{ .date }}">{{ time.Format "2 Jan 2006" (time.AsTime .date) }}</time>
    </p>
    <h3><a href="{{ .url }}" target="_blank" rel="noopener noreferrer">{{ .title }}</a></h3>
    <p>{{ .summary }}</p>
    {{ with .related }}
    <p class="work-links">
      {{ range . }}<a href="{{ .url }}" target="_blank" rel="noopener noreferrer">{{ .label }}</a>{{ end }}
    </p>
    {{ end }}
  </article>
  {{ end }}
</div>
<p class="work-all"><a href="{{ "archive/" | relURL }}">View archive &rarr;</a></p>
