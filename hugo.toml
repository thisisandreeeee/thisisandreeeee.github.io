baseURL = "https://thisisandreeeee.github.io/"
title = "Andre Tan"
theme = "introduction"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[outputs]
  home = ["HTML"]

[params]
  author = "Andre Tan"
  description = "Data scientist working at the intersection of machine learning, software engineering, and economics."
  favicon = "favicon.svg"
  customCSS = ["css/custom.css", "css/work.css"]
  themeStyle = "auto"
  showMenu = true
  showRSSButton = false
  fadeIn = true
  footerText = "© Andre Tan"
  [params.home]
    introHeight = "fullheight"
    localTime = false
    portraitAlt = "Portrait of Andre Tan"

[[menus.main]]
  name = "Home"
  url = "/"
  weight = 10

[[menus.main]]
  name = "About"
  url = "/#about"
  weight = 20

[[menus.main]]
  name = "Selected work"
  url = "/#selected-work"
  weight = 30

[[menus.main]]
  name = "Archive"
  url = "/archive/"
  weight = 40

[[menus.main]]
  name = "Contact"
  url = "/#contact"
  weight = 50

  [[params.social]]
    url = "https://drive.google.com/file/d/1aIQzLV9QAXNxKWZ58G13cDXesGFpwSGZ/view?usp=sharing"
    icon = "file-alt"
    icon_pack = "fas"
    label = "Resume"
    html_attributes = "target=\"_blank\" rel=\"noopener noreferrer\""

  [[params.social]]
    url = "mailto:tanandre93@gmail.com"
    icon = "envelope"
    icon_pack = "fas"
    label = "Email"

  [[params.social]]
    url = "https://www.linkedin.com/in/andre-tan"
    icon = "linkedin-in"
    icon_pack = "fab"
    label = "LinkedIn"
    html_attributes = "target=\"_blank\" rel=\"noopener noreferrer\""

  [[params.social]]
    url = "https://github.com/thisisandreeeee"
    icon = "github"
    icon_pack = "fab"
    label = "GitHub"
    html_attributes = "target=\"_blank\" rel=\"noopener noreferrer\""

  [[params.social]]
    url = "https://medium.com/@andrewrites"
    icon = "medium"
    icon_pack = "fab"
    label = "Medium"
    html_attributes = "target=\"_blank\" rel=\"noopener noreferrer\""

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[languages]
  [languages.en]
    label = "English"
    locale = "en-SG"
    contentDir = "content"
    weight = 1
    title = "Andre Tan"
